<svg width="154" height="229" viewBox="0 0 154 229" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 动态渐变 -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1CA3DB">
        <animate attributeName="stop-color" values="#1CA3DB;#6DD5FA;#2980B9;#1CA3DB" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0E7BA8">
        <animate attributeName="stop-color" values="#0E7BA8;#1CA3DB;#6DD5FA;#0E7BA8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0E7BA8">
        <animate attributeName="stop-color" values="#0E7BA8;#2980B9;#1CA3DB;#0E7BA8" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- 发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur">
        <animate attributeName="stdDeviation" values="2;4;2" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 阴影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1CA3DB" flood-opacity="0.6">
        <animate attributeName="flood-opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
      </feDropShadow>
    </filter>

    <!-- 背景光晕 -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1CA3DB" stop-opacity="0.3">
        <animate attributeName="stop-opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1CA3DB" stop-opacity="0"/>
    </radialGradient>

    <!-- 裁剪路径用于内部高光 -->
    <clipPath id="shapeClip">
      <path d="M77 25 L21 85 L69 129 L69 180 L37 180 Q37 215 63.5 215 Q90 215 90 180 L90 148 L109 164 L123 148 L91 118 L132 74 L117 59 L76 103 L52 83 L58 75 L92 40 Z"/>
    </clipPath>

    <!-- 内部高光渐变 -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- 背景光晕 -->
  <circle cx="77" cy="120" r="80" fill="url(#bgGlow)">
    <animate attributeName="r" values="75;85;75" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- 浮动粒子 -->
  <g>
    <circle cx="25" cy="40" r="2" fill="#6DD5FA" opacity="0.6">
      <animate attributeName="cy" values="40;35;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="100" r="1.5" fill="#1CA3DB" opacity="0.5">
      <animate attributeName="cy" values="100;95;100" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="160" r="1.8" fill="#2980B9" opacity="0.7">
      <animate attributeName="cy" values="160;155;160" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="180" r="2.2" fill="#6DD5FA" opacity="0.4">
      <animate attributeName="cy" values="180;175;180" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="60" r="1.2" fill="#1CA3DB" opacity="0.8">
      <animate attributeName="cy" values="60;55;60" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 主体蓝色形状（带发光和阴影） -->
  <path d="M77 25 L21 85 L69 129 L69 180 L37 180 Q37 215 63.5 215 Q90 215 90 180 L90 148 L109 164 L123 148 L91 118 L132 74 L117 59 L76 103 L52 83 L58 75 L92 40 Z"
        fill="url(#iconGrad)"
        filter="url(#glow) url(#shadow)">
    <animate attributeName="opacity" values="0.95;1;0.95" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- 内部高光效果 -->
  <path d="M77 25 L21 85 L69 129 L69 180 L37 180 Q37 215 63.5 215 Q90 215 90 180 L90 148 L109 164 L123 148 L91 118 L132 74 L117 59 L76 103 L52 83 L58 75 L92 40 Z"
        fill="url(#highlight)"
        clip-path="url(#shapeClip)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- 边缘高光线条 -->
  <path d="M77 25 L21 85 L69 129 L69 180 L37 180 Q37 215 63.5 215 Q90 215 90 180 L90 148 L109 164 L123 148 L91 118 L132 74 L117 59 L76 103 L52 83 L58 75 L92 40 Z"
        fill="none"
        stroke="white"
        stroke-width="0.5"
        stroke-opacity="0.3">
    <animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- 旋转光环 -->
  <ellipse cx="77" cy="120" rx="70" ry="90" fill="none" stroke="#6DD5FA" stroke-width="0.5" stroke-opacity="0.3" stroke-dasharray="5 10">
    <animateTransform attributeName="transform" type="rotate" values="0 77 120;360 77 120" dur="20s" repeatCount="indefinite"/>
  </ellipse>
</svg>